<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#13111c" />
    <meta name="description" content="カメラ映像に画像を重ねて撮影できるWebアプリ" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23a78bfa' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z'/><circle cx='12' cy='13' r='4'/></svg>" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700;800&display=swap" rel="stylesheet" />
    <title>OverlayCam</title>
  </head>
  <body>
    <div id="app">
      <header class="app-header">
        <h1 class="app-title">
          <svg class="app-title-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z" />
            <circle cx="12" cy="13" r="4" />
          </svg>
          <span class="app-title-text">OverlayCam</span>
        </h1>
      </header>

      <main class="stage-wrap">
        <div class="stage" id="stage">
          <video id="video" autoplay playsinline muted></video>
          <div class="overlay-layer" id="overlay-layer" hidden>
            <img id="overlay-img" alt="オーバーレイ画像" draggable="false" />
          </div>
          <div class="flash" id="flash"></div>

          <!-- カメラ起動前 / エラー時 -->
          <div class="stage-message" id="stage-message">
            <div class="stage-message-icon" id="stage-message-icon"></div>
            <p id="stage-message-text">カメラを起動しています…</p>
            <button class="btn btn-secondary" id="retry-btn" hidden>再試行</button>
          </div>

          <!-- オーバーレイ操作チップ -->
          <div class="overlay-tools" id="overlay-tools" hidden>
            <button class="chip" id="reset-overlay-btn" title="位置・サイズをリセット">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <polyline points="1 4 1 10 7 10" />
                <path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10" />
              </svg>
              リセット
            </button>
            <button class="chip" id="remove-overlay-btn" title="オーバーレイを削除">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <line x1="18" y1="6" x2="6" y2="18" />
                <line x1="6" y1="6" x2="18" y2="18" />
              </svg>
              削除
            </button>
          </div>
        </div>
      </main>

      <!-- レイアウトのがたつきを防ぐため常にスペースを確保し、visibilityで切り替える -->
      <p class="hint" id="hint">ドラッグで移動 / ピンチまたはホイールで拡大縮小 / Shift+ホイールで回転</p>

      <footer class="controls">
        <button class="ctrl-btn" id="pick-btn" title="オーバーレイ画像を選ぶ" aria-label="オーバーレイ画像を選ぶ">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="3" width="18" height="18" rx="4" />
            <circle cx="9" cy="9" r="2" />
            <path d="m21 15-3.5-3.5a2 2 0 0 0-2.8 0L6 20" />
          </svg>
        </button>

        <button class="shutter-btn" id="shutter-btn" title="撮影" aria-label="撮影" disabled>
          <span class="shutter-inner"></span>
        </button>

        <button class="ctrl-btn" id="flip-btn" title="カメラを切り替え" aria-label="カメラを切り替え" hidden>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="23 4 23 10 17 10" />
            <polyline points="1 20 1 14 7 14" />
            <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15" />
          </svg>
        </button>
        <span class="ctrl-spacer" id="flip-spacer"></span>
      </footer>
    </div>

    <!-- 撮影結果 -->
    <div class="result" id="result" hidden>
      <div class="result-card">
        <h2 class="result-title">撮影しました！</h2>
        <img id="result-img" alt="撮影結果" />
        <div class="result-actions">
          <button class="btn btn-primary" id="save-btn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
              <polyline points="7 10 12 15 17 10" />
              <line x1="12" y1="15" x2="12" y2="3" />
            </svg>
            保存
          </button>
          <button class="btn btn-primary" id="share-btn" hidden>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8" />
              <polyline points="16 6 12 2 8 6" />
              <line x1="12" y1="2" x2="12" y2="15" />
            </svg>
            共有
          </button>
          <button class="btn btn-secondary" id="close-result-btn">撮り直す</button>
        </div>
      </div>
    </div>

    <input type="file" id="file-input" accept="image/*" hidden />
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
